services:
  # Backend service (Django)
  # This service is used to run the Django backend application
  backend:
    build:
      context: .
      dockerfile: Backend/DockerFile
    container_name: goldfren_backend
    environment:
      - DEBUG=1
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DATABASE_URL=mysql://${MYSQL_ROOT_USER}:${MYSQL_ROOT_PASSWORD}@${MYSQL_HOSTNAME}/${MYSQL_CORE_DATABASE}
      - ALLOWED_HOSTS=localhost
    volumes:
      - ./Backend:/goldfren
      - goldfren_media:/goldfren/GoldFren_Media  
      - static_volume:/goldfren/static
      - ./djangocache:/tmp/django_cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Frontend service (React)
  # This service is used to run the React frontend application
  frontend:
    build:
      context: ./Frontend
      dockerfile: DockerFile
    container_name: goldfren_frontend
    environment:
      - VITE_API_URL=http://localhost
    volumes:
      - ./Frontend:/goldfren_frontend
      - frontend_node_modules:/goldfren_frontend/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mynetwork

  # MySQL service
  # This service is used to run the MySQL database
  mysql:
    image: mysql:8.0
    container_name: goldfren_mysql
    hostname: ${MYSQL_HOSTNAME}
    environment:
      MYSQL_DATABASE: ${MYSQL_CORE_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./SQL:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_ROOT_USER}", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Nginx service
  # This service is used to serve static files and proxy requests to the backend
  nginx:
    image: nginx:1.27.4-alpine
    container_name: goldfren_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - goldfren_media:/GoldFren_Media 
      - static_volume:/usr/share/nginx/html/static
    depends_on:
      - backend
      - frontend
    networks:
      - mynetwork

# Networks definition
# This section defines the custom network used by the services
networks:
  mynetwork:
    driver: bridge

# Volumes definition
# This section defines the named volumes used by the services
volumes:
  mysql_data:
  goldfren_media:
  static_volume:
  frontend_node_modules: