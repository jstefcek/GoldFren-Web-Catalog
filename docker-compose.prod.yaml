services:
  # Backend service (Django)
  # This service is used to run the Django backend application
  backend:
    build:
      context: .
      dockerfile: Docker/backend/DockerFile.prod
    container_name: goldfren_backend
    restart: always
    env_file:
      - .env.prod
    environment:
      PYTHONUNBUFFERED: 1
    volumes:
      - ./Backend:/goldfren
      - goldfren_media:/goldfren/GoldFren_Media  
      - static_volume:/goldfren/static
      - ./djangocache:/tmp/django_cache
      - ./logs:/goldfren/logs
    depends_on:
      goldfren_mysql:
        condition: service_healthy
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10 
      start_period: 60s

  # Frontend service (React)
  # This service is used to run the React frontend application
  frontend:
    build:
      context: .
      dockerfile: Docker/frontend/DockerFile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_APP_VERSION: ${VITE_APP_VERSION}
        VITE_GA_ID: ${VITE_GA_ID}
    container_name: goldfren_frontend
    restart: no
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    volumes:
      - ./Frontend:/goldfren_frontend
      - frontend_node_modules:/goldfren_frontend/node_modules
      - ./Frontend/public:/shared/public
      - frontend_build:/goldfren_frontend/dist
    depends_on:
      - backend
    networks:
      - mynetwork

  # MySQL service
  # This service is used to run the MySQL database
  goldfren_mysql:
    image: mysql:8.0
    container_name: goldfren_mysql
    restart: always
    hostname: ${MYSQL_HOSTNAME}
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${MYSQL_CORE_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Europe/Prague
    volumes:
      - mysql_data:/var/lib/mysql
      - ./SQL:/docker-entrypoint-initdb.d:ro
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u${MYSQL_ROOT_USER} -p${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Nginx service
  # This service is used to serve static files and proxy requests to the backend
  nginx:
    image: nginx:1.29.4-alpine
    container_name: goldfren_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl-params.conf:/etc/nginx/snippets/ssl-params.conf
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - goldfren_media:/GoldFren_Media
      - static_volume:/usr/share/nginx/html/static
      - ./Frontend/public:/shared/public
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s

  # Certbot service
  # Auto certtificate renew
  certbot:
    image: certbot/certbot
    container_name: goldfren_certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >-
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 24h;
      done
    networks:
      - mynetwork

# Networks definition
# This section defines the custom network used by the services
networks:
  mynetwork:
    driver: bridge
    name: goldfren_network

# Volumes definition
# This section defines the named volumes used by the services
volumes:
  mysql_data:
  goldfren_media:
  static_volume:
  frontend_node_modules:
  frontend_build: