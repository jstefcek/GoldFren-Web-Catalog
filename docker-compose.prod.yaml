services:
  # Backend service (Django)
  # This service is used to run the Django backend application
  backend:
    build:
      context: .
      dockerfile: Docker/backend/DockerFile.prod
    container_name: goldfren_backend
    env_file:
      - .env.prod
    volumes:
      - ./Backend:/goldfren
      - goldfren_media:/goldfren/GoldFren_Media  
      - static_volume:/goldfren/static
      - ./djangocache:/tmp/django_cache
      - ./logs:/goldfren/logs
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Frontend service (React)
  # This service is used to run the React frontend application
  frontend:
    build:
      context: ./Frontend
      dockerfile: ../Docker/frontend/DockerFile.prod
    container_name: goldfren_frontend
    env_file:
      - .env.prod
    volumes:
      - ./Frontend:/goldfren_frontend
      - frontend_node_modules:/goldfren_frontend/node_modules
      - ./Frontend/public:/shared/public:ro
      - frontend_build:/goldfren_frontend/dist
    depends_on:
      - backend
    networks:
      - mynetwork

  # MySQL service
  # This service is used to run the MySQL database
  goldfren_mysql:
    image: mysql:8.0
    container_name: goldfren_mysql
    hostname: ${MYSQL_HOSTNAME}
    environment:
      MYSQL_DATABASE: ${MYSQL_CORE_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: Europe/Prague
    volumes:
      - mysql_data:/var/lib/mysql
      - ./SQL:/docker-entrypoint-initdb.d
    networks:
      - mynetwork
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_ROOT_USER}", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # Nginx service
  # This service is used to serve static files and proxy requests to the backend
  nginx:
    image: nginx:1.29.1-alpine
    container_name: goldfren_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl-params.conf:/etc/nginx/snippets/ssl-params.conf
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - goldfren_media:/GoldFren_Media 
      - static_volume:/usr/share/nginx/html/static
      - ./Frontend/public:/shared/public:ro
      - frontend_build:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    networks:
      - mynetwork

  # Certbot service
  # Auto certtificate renew
  certbot:
    image: certbot/certbot
    container_name: goldfren_certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >-
      trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h;
      done
    networks:
      - mynetwork

# Networks definition
# This section defines the custom network used by the services
networks:
  mynetwork:
    driver: bridge

# Volumes definition
# This section defines the named volumes used by the services
volumes:
  mysql_data:
  goldfren_media:
  static_volume:
  frontend_node_modules:
  frontend_build: