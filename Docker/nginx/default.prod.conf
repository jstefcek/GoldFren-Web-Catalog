server {
	# ---- Web HTTP Server Redirect ----
    listen 80;
    server_name catalog.goldfren.cz catalog.goldfren.com 185.80.30.44;
	
    # Hide nginx version
    server_tokens off;

    # Serve Let's Encrypt ACME challenge files
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
    }
	
	# Redirect to HTTPS
    return 301 https://catalog.goldfren.cz$request_uri;
}

server {
	# ---- Web HTTPS Server ----
	# Port and server name
    listen 443 ssl http2;
    server_name catalog.goldfren.cz catalog.goldfren.com;

    # Hide nginx version
    server_tokens off;

    # Maximal image size for upload
    client_max_body_size 10M;

    # Encoding for website
    charset utf-8;

    # ---- SSL configuration ----
    ssl_certificate /etc/letsencrypt/live/catalog.goldfren.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalog.goldfren.cz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # ---- Web Security ----
    # Additional security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
	
	# ---- Compression ----
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";

    # Only compress these
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/xhtml+xml
        application/ld+json
        application/manifest+json
        font/ttf
        font/otf
        image/svg+xml
        image/x-icon;

    # Enable keep-alive connections
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Buffer sizes
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
		
	# Serve ACME challenges
    location /.well-known/acme-challenge/ {
        alias /var/www/certbot/.well-known/acme-challenge/;
        try_files $uri =404;
    }
	
	# ---- Serving based on location ----
	# Serve icons
    location /icons/ {
        alias /shared/public/icons/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve logo
    location /logo/ {
        alias /shared/public/logo/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Server DJANGO media files
    location ^~ /GoldFren_Media/ {
		alias /GoldFren_Media/;
		autoindex off;
		access_log off;
		add_header Cache-Control "public, max-age=3600";
	}

    # Admin access for DJANGO
    location /admin {
        proxy_pass http://backend:8000/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Allow iframe page to display from specific trusted domains
    location /search {
        add_header X-Frame-Options "ALLOW-FROM https://moto-complet.hu" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://moto-complet.hu" always;
        try_files $uri $uri/ /index.html;
    }

    # Proxy for public API
    location /api/goldfren/public/ {
        proxy_pass http://backend:8000/api/goldfren/public/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
		add_header Cache-Control "no-store";
    }

    #  Server static files for admin access
    location /static/ {
        alias /usr/share/nginx/html/static/;
        try_files $uri $uri/ =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy private API – only internal net allowed
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
		add_header Cache-Control "no-store";
    }

    # ---------- Vite build ----------
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache for hashed assets
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Long-cache for other static (favicons, fonts, manifest, etc.)
    location ~* \.(css|js|mjs|ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|otf|json)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML should not be cached
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}